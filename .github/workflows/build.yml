name: Build Atmospheric

on:
  push:
    paths: ["plugin/**", "engine/**", "designer/**", "server/**", "installer/**", ".github/workflows/build.yml", "lab.html", "tools/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the 'latest' pre-release with this build's macOS zip"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_TAG: "8.0.8"

jobs:
  relay:
    name: Relay server tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm test
        working-directory: server
      - name: Lab and plugin mapping agree
        run: |
          node tools/gen-vectors.mjs
          git diff --exit-code plugin/tests/vectors.json || (echo "::error::lab.html mapping changed; run node tools/gen-vectors.mjs and commit" && exit 1)
      - name: Relay serves the current designer
        run: |
          for f in index.html atmos-worklet.js atmos.wasm starter-bible.json; do
            cmp "designer/$f" "server/public/designer/$f" || (echo "::error::designer/$f differs from the relay copy; run tools/sync-designer.sh" && exit 1)
          done

  engine:
    name: Shared engine (native + WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native smoke test (every source x movement x space)
        run: |
          g++ -std=c++20 -O2 -Iengine -Iengine/osp engine/tests/core_smoke.cpp engine/atmos/*.cpp engine/osp/engine/*.cpp -o core_smoke
          ./core_smoke
      - name: WebAssembly build (the sound designer's engine)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 wasi-libc libc++-18-dev-wasm32 libc++abi-18-dev-wasm32 libclang-rt-18-dev-wasm32
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/wasm-ld-18 /usr/local/bin/wasm-ld
          sh engine/wasm/build.sh "$RUNNER_TEMP/atmos.wasm"

  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DATMOS_FETCH_JUCE=ON -DATMOS_JUCE_TAG=$JUCE_TAG
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Unit tests
        run: ./build/AtmosTests_artefacts/Release/AtmosTests --snapshot editor.png
      - name: Sign ad hoc
        run: |
          A=build/Atmospheric_artefacts/Release
          for b in "$A/VST3/Atmospheric.vst3" "$A/AU/Atmospheric.component" "$A/Standalone/Atmospheric.app"; do
            codesign --force --deep --sign - "$b"
          done
      - name: Host check (VST3 + AU)
        run: |
          A=build/Atmospheric_artefacts/Release
          ./build/AtmosHostCheck_artefacts/Release/AtmosHostCheck "$A/VST3/Atmospheric.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/Atmospheric.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumu Atm1 Atmo
      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --timeout-ms 600000 --validate-in-process \
            --output-dir pluginval-logs build/Atmospheric_artefacts/Release/VST3/Atmospheric.vst3
      - name: GUI evidence on Apple Silicon (informational)
        continue-on-error: true
        run: |
          B=./build/AtmosGuiBench_artefacts/Release/AtmosGuiBench.app/Contents/MacOS/AtmosGuiBench
          [ -x "$B" ] || B=$(find build/AtmosGuiBench_artefacts -type f -perm -u+x -name AtmosGuiBench | head -1)
          sysctl -n machdep.cpu.brand_string > gui-mac.txt; sw_vers >> gui-mac.txt
          for a in "--instances 0" "--editors 0" "--editors 1 --fixture clear@noon --quality full" "--editors 1 --fixture heavy_rain@noon --quality full" \
                   "--editors 1 --fixture heavy_rain@noon --quality economy" "--editors 1 --fixture heavy_rain@noon --quality still" \
                   "--instances 4 --editors 4 --fixture rain@noon --quality economy" "--editors 0 --cycles 50"; do
            timeout 120 "$B" --seconds 10 $a | tail -1 >> gui-mac.jsonl || echo "{\"failed\":\"$a\"}" >> gui-mac.jsonl
          done
          cat gui-mac.txt gui-mac.jsonl
          ./build/AtmosTests_artefacts/Release/AtmosTests --atlas mac-atlas fixtures=clear,heavy_rain,snow,fog,thunderstorm times=noon,night scale=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-evidence-macOS
          path: |
            gui-mac.txt
            gui-mac.jsonl
            mac-atlas
      - name: Package
        run: |
          A=build/Atmospheric_artefacts/Release
          D=dist/Atmospheric-macOS
          mkdir -p "$D"
          cp -R "$A/VST3/Atmospheric.vst3" "$A/AU/Atmospheric.component" "$A/Standalone/Atmospheric.app" "$D/"
          cp installer/macos/Install.command installer/macos/Uninstall.command "installer/macos/READ ME.txt" "$D/"
          chmod +x "$D/Install.command" "$D/Uninstall.command"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Atmospheric-macOS Atmospheric-macOS.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: Atmospheric-macOS
          path: |
            dist/Atmospheric-macOS.zip
            editor.png
            editor-globe.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-macOS
          path: pluginval-logs
          if-no-files-found: ignore

  windows:
    # Switched off: macOS is the only platform built for now
    if: ${{ false }}
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B build -G "Visual Studio 17 2022" -A x64 "-DATMOS_FETCH_JUCE=ON" "-DATMOS_JUCE_TAG=${{ env.JUCE_TAG }}" "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi" "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" "-DCMAKE_MODULE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Unit tests
        run: build\AtmosTests_artefacts\Release\AtmosTests.exe
      - name: Host check
        run: build\AtmosHostCheck_artefacts\Release\AtmosHostCheck.exe build\Atmospheric_artefacts\Release\VST3\Atmospheric.vst3
      # pluginval's own process dies during "Editor Automation" on Windows runners, while an
      # exact replica of that test (AtmosHostCheck, above) passes on the same machine. So:
      # pluginval's non-GUI tests are required here (macOS runs the full set including GUI),
      # the host check's editor tests and replica are required, and the full run
      # stays visible as an informational step until the cause is found.
      - name: pluginval (required; editor covered by the host check)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          & pv\pluginval.exe --strictness-level 7 --timeout-ms 600000 --skip-gui-tests build\Atmospheric_artefacts\Release\VST3\Atmospheric.vst3
          Write-Host "pluginval exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: pluginval full run under the debugger (informational)
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          _NO_DEBUG_HEAP: "1" # the debug heap a debugger turns on can hide heap misuse
        run: |
          if (-not (Test-Path pv\pluginval.exe)) {
            Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
            Expand-Archive pluginval.zip -DestinationPath pv
          }
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { Write-Host "cdb not installed on this runner"; exit 1 }
          $pdbs = (Get-ChildItem -Recurse build -Filter *.pdb | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique) -join ";"
          $sym = "srv*C:\symcache*https://msdl.microsoft.com/download/symbols;$pdbs"
          & $cdb.FullName -g -G -lines -y "$sym" -c "g; .echo ===== CRASH =====; .ecxr; kP 40; .echo ===== ALL THREADS =====; ~*k 12; q" `
            pv\pluginval.exe --strictness-level 7 --validate-in-process --timeout-ms 600000 build\Atmospheric_artefacts\Release\VST3\Atmospheric.vst3
          Write-Host "exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          $d = "dist\Atmospheric-Windows"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item -Recurse build\Atmospheric_artefacts\Release\VST3\Atmospheric.vst3 $d
          Copy-Item build\Atmospheric_artefacts\Release\Standalone\Atmospheric.exe $d
          Copy-Item installer\windows\Install.ps1 $d
          Compress-Archive -Path $d -DestinationPath dist\Atmospheric-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: Atmospheric-Windows, path: dist/Atmospheric-Windows.zip }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pluginval-Windows, path: pluginval-logs, if-no-files-found: ignore }

  linux:
    # Switched off: macOS is the only platform built for now
    if: ${{ false }}
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DATMOS_FETCH_JUCE=ON -DATMOS_JUCE_TAG=$JUCE_TAG
          cmake --build build
      - name: Tests and host check
        run: |
          xvfb-run -a ./build/AtmosTests_artefacts/Release/AtmosTests
          xvfb-run -a ./build/AtmosHostCheck_artefacts/Release/AtmosHostCheck build/Atmospheric_artefacts/Release/VST3/Atmospheric.vst3
      - name: Package
        run: |
          mkdir -p dist/Atmospheric-Linux
          cp -R build/Atmospheric_artefacts/Release/VST3/Atmospheric.vst3 build/Atmospheric_artefacts/Release/Standalone/Atmospheric dist/Atmospheric-Linux/
          (cd dist && zip -qr Atmospheric-Linux.zip Atmospheric-Linux)
      - uses: actions/upload-artifact@v4
        with: { name: Atmospheric-Linux, path: dist/Atmospheric-Linux.zip }

  release:
    name: Publish download
    # Publishing replaces the public download, so it only happens on request:
    # Actions > Build Atmospheric > Run workflow, with "publish" ticked
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [relay, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Update the "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="artifacts/Atmospheric-macOS/dist/Atmospheric-macOS.zip"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "Atmospheric test build ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. macOS: unzip, then right-click Install.command > Open." \
            $files
